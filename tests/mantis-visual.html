<!doctype html><title>Mantis visual check</title><style>body{margin:0;background:#deded3}canvas{display:block}nav{position:fixed;top:10px;left:10px}button{padding:12px}</style><nav><button id="open">Open wings</button><button id="side">Side view</button></nav><script type="module">
import * as T from '/node_modules/three/build/three.module.js';
import {createMantis} from '/src/mantis.js';import {CockroachController} from '/src/simulation.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(devicePixelRatio);r.setClearColor(0xdeddd3);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.15;document.body.append(r.domElement);
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xf5f5e9,0x70664a,2));const light=new T.DirectionalLight(0xffedcc,3);light.position.set(-3,8,4);scene.add(light);const cam=new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);cam.position.set(0,10,1);cam.lookAt(0,0,0);const c=new CockroachController(),m=createMantis(c);scene.add(m.group);let open=false;document.querySelector('#open').onclick=()=>{open=!open;if(open)c.keys.add('KeyD');else c.keys.delete('KeyD');};document.querySelector('#side').onclick=()=>{cam.position.set(5,3,5);cam.lookAt(0,0,0);};let t=0;function frame(){requestAnimationFrame(frame);t+=1/60;m.update(1/60,t,{idle:{adjust:-1},debug:false,flying:open});r.render(scene,cam);}frame();
</script>
